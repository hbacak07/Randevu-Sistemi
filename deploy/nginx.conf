# /etc/nginx/sites-available/randevu  →  sites-enabled'e symlink yapın
# SSL için: sudo certbot --nginx -d randevu.ornek.com

upstream randevu_api {
    # PM2 cluster tek port üzerinden dinler, Nginx'in tek adres bilmesi yeterli
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name randevu.ornek.com;

    # React build çıktısı (npm run build → apps/web/dist)
    root /var/www/randevu-sistemi/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite dosya adlarına hash ekler → uzun süre önbelleklenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE: tamponlamayı kapat, bağlantıyı uzun tut
    location /api/notifications/stream {
        proxy_pass http://randevu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # REST API
    location /api/ {
        proxy_pass http://randevu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket: Upgrade başlıklarını ilet
    location /ws {
        proxy_pass http://randevu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # React Router: bilinmeyen yolları index.html'e düşür (ör. /randevularim yenilenince)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
